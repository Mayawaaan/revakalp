    <script>
      (function () {
        var root = document.documentElement;
        var validS = [
          "royal-burgundy",
          "emerald-banaras",
          "indigo-jaipur",
          "saffron-udaipur",
          "peacock-kanchipuram",
          "jamuni-mysore",
          "rose-chanderi",
          "sandalwood-maheshwar",
          "obsidian-kashi"
        ];
        var pendingTimer = null;

        function applyBootTheme(scheme, mode) {
          if (pendingTimer) {
            clearTimeout(pendingTimer);
            pendingTimer = null;
          }
          if (scheme && validS.indexOf(scheme) !== -1) {
            root.dataset.theme = scheme;
            try {
              localStorage.setItem("rk-theme-scheme", scheme);
            } catch (e) {}
          }
          var resolvedMode = mode === "dark" ? "dark" : "light";
          root.dataset.mode = resolvedMode;
          root.style.colorScheme = resolvedMode;
          try {
            if (mode === "dark" || mode === "light") {
              localStorage.setItem("rk-theme-mode", resolvedMode);
            }
          } catch (e) {}
          delete root.dataset.themePending;
        }

        try {
          var cachedS = localStorage.getItem("rk-theme-scheme");
          var cachedM = localStorage.getItem("rk-theme-mode");
          if (cachedS && validS.indexOf(cachedS) !== -1) {
            root.dataset.theme = cachedS;
            root.dataset.mode = cachedM === "dark" ? "dark" : "light";
            root.style.colorScheme = root.dataset.mode;
          } else {
            root.dataset.themePending = "true";
            root.dataset.mode = "light";
            root.style.colorScheme = "light";
            pendingTimer = setTimeout(function () {
              delete root.dataset.themePending;
            }, 2200);
          }

          var rawApi = "%VITE_API_URL%";
          var cleanApi =
            rawApi &&
            rawApi.indexOf("VITE_API_URL") === -1 &&
            rawApi !== "undefined" &&
            rawApi !== "null"
              ? rawApi.replace(/^['"]+|['"]+$/g, "").replace(/\/+$/, "")
              : "";
          var isLocalHost =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1";
          var isLocalApi = /^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(cleanApi);
          var apiBase =
            cleanApi && (!isLocalApi || isLocalHost)
              ? cleanApi
              : isLocalHost
                ? "http://localhost:5000"
                : "https://revakalp-2461.onrender.com";
          window.__RK_SETTINGS_PROMISE__ = fetch(apiBase + "/api/settings", {
            cache: "no-store",
            credentials: "include"
          })
            .then(function (res) {
              if (!res.ok) return null;
              return res.json();
            })
            .then(function (data) {
              if (data && data.themeScheme && validS.indexOf(data.themeScheme) !== -1) {
                applyBootTheme(data.themeScheme, data.themeMode);
              } else {
                delete root.dataset.themePending;
              }
              return data;
            })
            .catch(function () {
              delete root.dataset.themePending;
              return null;
            });
        } catch (e) {
          delete root.dataset.themePending;
        }
      })();
    </script>
